[package]
name = "certus-gate"
version = "0.1.0"
edition = "2021"
description = "Deterministic verdict layer of the Certus Factory safety gate"
license = "MIT"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.10"

[profile.release]
debug = false
strip = true
incremental = false

[profile.dev]
debug = false
incremental = false
